# ECI-CAS ecosystem manifest — ECI-spec-v0-35 §10
#
# Phase 0.5: real Sensory, Governance, Analytics, Impulse, Intent, Consolidator;
# Personality/Knowledge mocked; Security and Action still mocked.
#
#   Sensory     real, deterministic since Phase 0 (§13.1)
#   Governance  real, deterministic since Phase 0.1 — the role turned out
#               to need no model at all (docs/ECI-spec-revisions-v0-34.md)
#   Analytics   real and SUBSTRATE-BACKED as of Phase 0.2 — the first role
#               that genuinely reasons, and the first consumer of the
#               substrates table below
#   Impulse     real, deterministic drift + weighted appraisal since Phase 0.3
#   Intent      real and SUBSTRATE-BACKED as of Phase 0.4 — the first role
#               with a persona (docs/phase-0.4-intent.md). Core Anchors
#               live in Archive as data (data/archive/identity/), not in
#               this manifest — see agents/intent/contract.py.
#
# Analytics and Intent both need a credential. Check yours before booting:
#     python -m tools.preflight --manifest manifests/ecosystem-manifest.yaml
# Set roles.analytics.mock / roles.intent.mock: true to run at zero cost.
#
# Only phase, roles.*.mock, storage.profile, and intent.nodes change
# between phases (§14) — nothing in the bus or this schema changes.

version: "0.35"
ecosystem_name: "eci-cas-prototype"
phase: 0.5                            # 0=mockup, 0.1=Governance, 0.2=Analytics, 0.3=Impulse, 0.4=Intent, 0.5=v0.35 (Consolidator split, fan-out, Intent veto)

# Budget tier (Phase 0.2.2, docs/budget-tiers-appendix.md) — which vendor
# backs each cognitive role, structurally. Orthogonal to budget_mode below:
# a tier is a design-time choice, budget_mode is a runtime latch, and any
# tier can still latch into budget mode on a failure or spend cap.
#
#   minimal   analytics mocked, intent/consolidation on a local model — $0
#   budget    analytics on a local model, consolidation on fast-reflex
#   default   everything on fast-reflex (this manifest's prior behaviour)
#   super     fast-reflex everywhere except consolidation, which gets
#             identity-specialist
#   custom    ignore this field; roles.* below apply exactly as written
#
# One line, then restart (budget/tiers.py). Overwrites roles.analytics.*
# and roles.intent.{nodes[*].substrate,consolidation_substrate} — it wins
# outright rather than filling gaps, so switching tiers is really one
# edit. Intent's live tier and consolidation aren't built yet (Phase
# 0.4+); applying a tier still records their substrate choice so this
# manifest keeps working unmodified once they are.
budget_tier: "default"

infrastructure:
  deployment_mode: "local-process"    # local-process | docker-nested | azure-bicep
  network_name: "agent-bus-net"

timers:                               # two independent clocks — §11.1
  watchdog:
    interval_x_sec: 5.0               # Level 1: Deterministic Ping threshold
    interval_y_sec: 10.0              # Level 2: SystemCheck escalation threshold (X+Y = 15s)
    max_check_retries: 2
  impulse:
    idle_musing_interval_sec: 7200    # organic/social quiet-period timer (§15 default)

storage:
  profile: "hybrid-parquet"             # json (legacy) | hybrid-parquet (Phase 0.8: structured store in Parquet, queue/working in JSON)
  root: "data/archive"

message_bus:
  type: "embedded-pubsub"             # in-memory for POC
  topics: [ events.*, system.diagnostic, system.control ]

# Substrate classes -> vendor mapping, ONE place (§10.2). Agents ask for
# a CLASS; only this table knows the vendor. Swapping providers, models
# or endpoints is a change here and nowhere else. Listed cheapest to
# most expensive.
#
#   provider     registry key or alias — anthropic | openai | groq |
#                together | mistral | openrouter | vllm | ollama |
#                lmstudio | echo  (see substrates/registry.py)
#   model        vendor model id, recorded as the forensic source_model (§7.4)
#   api_key_env  env var holding the credential; null for keyless local
#                endpoints, which must then set base_url
#   base_url     override endpoint — gateways, self-hosted, local runtimes
#   max_tokens   ceiling per call
#
# Model ids and per-MTok prices checked against vendor/aggregator docs on
# 2026-08-23; validate reachability with your own keys:
#     python -m tools.preflight --manifest manifests/ecosystem-manifest.yaml --live
substrates:
  # Minimal/Budget tiers' local model — genuinely free, keyless.
  # Point base_url at a real Ollama/LM Studio/vLLM endpoint before
  # running Minimal for real; until then it fails preflight/bootstrap
  # with "connection refused" rather than silently billing a hosted
  # model (this exact mistake has happened once before — Phase 0.4).
  local-fast:
    provider: "ollama"                # openai-compatible adapter, §10.2
    model: "llama3.1:8b"
    api_key_env: null                 # keyless — a local runtime needs no key
    base_url: "http://localhost:11434/v1"
    max_tokens: 512
    timeout_sec: 120                  # local inference is slower than a hosted API
    price_per_mtok: { input: 0.00, output: 0.00 }
    notes: "Minimal/Budget tiers' local model. Point base_url at your actual Ollama/LM Studio/vLLM endpoint."

  # PREPROD STRESS TEST (deliberate, temporary): cheapest real OpenAI
  # model, swapped in to press bottlenecks (odd JSON, contract
  # violations, latency, rate limits) before prod. Was claude-haiku-4-5.
  fast-reflex:
    provider: "openai"                # openai-compatible adapter, §10.2
    model: "gpt-5.4-nano"
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 512
    timeout_sec: 60                   # one hung call would hang the whole bus (§3)
    price_per_mtok: { input: 0.20, output: 1.25 }
    options: { token_param: "max_completion_tokens" }  # gpt-5.4-nano 400s on max_tokens; pin skips the reactive probe
    notes: "PREPROD STRESS TEST — cheapest OpenAI model. Was claude-haiku-4-5-20251001."

  # Reserved for Phase 3 multi-substrate diversity (§7.5). Untouched by
  # the preprod stress test — still Haiku, not part of that pass.
  orthogonal:
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"
    max_tokens: 1024
    timeout_sec: 60
    price_per_mtok: { input: 1.00, output: 5.00 }   # CHECK against current vendor pricing
    notes: "unused until Phase 3 multi-substrate diversity, §7.5"

  # Super tier's consolidation slot — deliberately expensive, rare
  # (once-a-day epoch writing, never the live pipeline). A real,
  # well-behaved, non-cheapest model to consolidate against.
  identity-specialist:
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"
    max_tokens: 2048
    timeout_sec: 120
    price_per_mtok: { input: 1.00, output: 5.00 }
    notes: "Super tier consolidation only; not used by the live pipeline. Real specialist (e.g. Opus) TBD before prod — see docs/phase-0.2.2-budget-tiers.md."

  # Worked examples of the same contract pointed elsewhere — swap a class
  # above to one of these shapes to change vendor with no code change.
  #
  # openai-example:
  #   provider: "openai"
  #   model: "gpt-4o-mini"
  #   api_key_env: "OPENAI_API_KEY"
  # offline-example:
  #   provider: "echo"                # no network, no cost; exercises fallbacks
  #   model: "none"

# Budget mode (Phase 0.2.1) — adaptive substrate throttling.
#
# Live while the substrate is healthy and spend is under the cap; the
# deterministic per-task fallbacks Analytics already has when it isn't.
# The pipeline never stops and never degrades silently.
#
# Latches on:
#   manual      an operator said "switch to budget mode"
#   terminal    ONE unrecoverable failure (bad key, exhausted credit,
#               unknown model) — retrying cannot help
#   transient   failure_threshold consecutive recoverable failures (rate
#               limit, overload, timeout). The vendor SDK already retried
#               each of these twice with backoff before we saw it.
#   spend_cap   estimated spend crossed spend_cap_usd
#
# The spend figure is an ESTIMATE from token usage against the
# price_per_mtok values above. It ignores cache and batch discounts. It
# is a smoke alarm for runaway loops, not an accounting control — the
# real number is in the vendor's console.
budget_mode:
  enabled: true
  initial_mode: "live"
  failure_threshold: 3              # consecutive TRANSIENT failures before latching
  spend_cap_usd: 2.00               # null disables the cap entirely
  warn_at_fraction: 0.5             # one-time warning at 50% of the cap

roles:
  # Deterministic tier — native code (mock: true in Phase 0)
  sensory:   { tier: deterministic, mock: false }   # real from day one, §13.1
  impulse:   { tier: deterministic, mock: true,
               initial_vectors: { curiosity: 0.8, fatigue: 0.1, urgency: 0.0, social_drive: 0.5, temperature: 0.4 },
               severity:        { urgency_elevated_threshold: 0.6, ceiling: "Elevated" } }  # v0.31 guardrail: Impulse alone can never assess above this
  # Security — deterministic rule engine, real as of Phase 0.6. No
  # substrate and no credential: the "real" tier here costs nothing to
  # run, it just needs its rules. A missing or unreadable rules file
  # STOPS the bootstrap rather than degrading, because a Security that
  # can't load its rules answers green, which is the mock wearing the
  # real one's name. Set mock: true to get that deliberately.
  # `rules` is resolved relative to the manifest, ./config, or the repo
  # root — a bare filename doesn't depend on the working directory.
  security:  { tier: deterministic, mock: false, rules: "security_rules.json" }
  # Action — deterministic executor, real as of Phase 0.6. Sinks are the
  # only thing that changes between mock and real: the role's logic,
  # failure contract and silence-on-success are identical either way.
  # Types: stdout | stderr | file (path required) | null. `callback` is
  # deliberately NOT manifest-configurable — a deployment file naming a
  # Python callable to import would make the manifest an execution
  # vector, and Action is the one role whose job is to affect the world.
  # An unknown type stops the bootstrap; an empty list warns loudly and
  # runs a null sink, because a mute system is easy to ship and hard to
  # notice.
  action:
    tier: deterministic
    mock: false
    sinks:
      - { type: stdout }
      # Relative paths land under storage.root (see bootstrap).
      - { type: file, path: "spoken.jsonl" }
  # Archive — the store is always real (step 2 constructs it before any
  # role exists). `mock` here selects only whether Archive also has a BUS
  # door: a write topic for agents that have no business holding the
  # store, plus a receipt on system.control so that a write to long-term
  # memory is observable from outside Archive at all. Live as of Phase
  # 0.6; set true to return to store-only.
  archive:   { tier: deterministic, mock: false }

  # Governance — deterministic dispatcher, always real (v0.34). No
  # substrate, no temperature, no system_instruction: there is no model to
  # instruct. Every hop is settled by the envelope, and a verdict that
  # cannot be read goes to Analytics rather than to a model in the router
  # seat. `mock` is ignored, as it is for Sensory.
  governance:
    tier: deterministic
    mock: false
    context_strategy: "per_event_statutory_reset"

  # Cognitive tier — LLM-backed. Analytics is real as of Phase 0.2; Intent
  # is next in §13.4's sequence.
  analytics:
    tier: cognitive
    mock: false                       # set true for a zero-cost ecosystem
    substrate: "fast-reflex"          # swap the vendor in the table above, not here
    temperature: 0.2
    max_tokens: 512                   # recommendations are 1-3 sentences
    # Raise on an unusable substrate answer instead of degrading. Off by
    # default — an outage must never stop the pipeline. Useful while
    # calibrating, where a silent fallback would hide a bad prompt.
    strict: false
    # Condensed 2026-08-23: the persona-boundary and JSON-shape rules were
    # previously stated here AND in contract.RESPONSE_CONTRACT AND in
    # TASK_BRIEFS — three restatements of the same two points, on every
    # single call. RESPONSE_CONTRACT is the code-fixed backstop for those
    # (survives even if this field is blanked). See docs/phase-0.2-analytics.md
    # for the before/after and the token-cost rationale.
    #
    # v0.35e: the old "gating judgment: decline if unsure" line is gone —
    # Analytics was severed from Security under v0.35e and no longer has
    # anything to gate. Kept generic/short rather than repurposed, in case
    # this role gets a new job later.
    system_instruction: |
      You are ANALYTICS: the reasoning agent in a multi-agent system.
      No persona; advise in keywords, not full sentences.
  intent:
    tier: cognitive
    mock: false                       # set true for a zero-cost ecosystem
    substrate: "fast-reflex"          # v0.35f: flat, like Analytics — the
                                      # per-node `nodes:` list went away with
                                      # the fleet/rotation model (§7 superseded)
    temperature: 0.7
    # How many CONCLUDED EVENTS of conversation Intent sees on a live call
    # (v0.35c). Whole events, never a partial one — one temp-log entry is
    # one event, so a window can't be cut mid-event. Tier-scaled by
    # budget/tiers.py (minimal 1, budget 5, default 10, super 15); this
    # value is what a `custom`/`default` tier uses as written.
    context_events: 10
    # Short and structural on purpose — same discipline as Analytics'
    # condensed instruction (docs/phase-0.2-analytics.md): the response
    # shape lives in contract.py's code-fixed RESPONSE_CONTRACTS as a
    # backstop, and the actual character (Core Anchors: stance, values,
    # boundaries) lives in Archive as data (agents/intent/contract.py's
    # DEFAULT_CORE_ANCHORS, seeded once into data/archive/identity/), not
    # here — this field states the role and nothing else.
    #
    # v0.35e: no longer says "advisory only". Security's yellow and red
    # lanes both route here now, so Intent decides `proceed` on those two
    # registers and the instruction must not tell it otherwise.
    system_instruction: |
      You are INTENT: the persona of a multi-agent system, speaking
      directly to the human. Your personality is constant — always
      voice it. Note: If Security is yellow or red, revise or your
      message is blocked.

  # Personality and Knowledge — NEW in v0.35b. One reusable agent CLASS
  # (agents/archive_lookup/), two configurations: same shape, same output
  # contract, same never-write posture, differing only in which Archive
  # store they read and the wording of their brief. Expected to become a
  # family — a third member is one more entry here, not one more file.
  #
  # Read-only by construction: they are handed a query-only view of
  # Archive, so there is no write surface on the object they hold.
  # Writing long-term memory is Consolidator's job alone (§6, v0.35g).
  #
  # Live as of Phase 0.6. The mock proved the wiring at zero cost; what
  # it could not do is judge which of N records BEARS on the event in
  # front of it, which is the one thing here that isn't expressible as a
  # rule. Both run on the cheap slot on purpose: this is two extra calls
  # on EVERY event, in parallel with Impulse and Analytics.
  #
  # An empty store short-circuits before the call — reasoning over zero
  # records costs money to be told there is nothing there. Set mock: true
  # for a zero-cost ecosystem; both degrade to silence, never invention.
  personality:
    tier: cognitive
    mock: false                       # set true for a zero-cost ecosystem
    substrate: "fast-reflex"
    temperature: 0.2
    query_limit: 8                    # bounded read — this runs on every event
    system_instruction: |
      You are PERSONALITY: the identity-lookup agent in a multi-agent
      system. No persona of your own; advise in keywords, not full
      sentences. Report what the archived identity record says is
      relevant to this event — values, boundaries, prior stances.
  knowledge:
    tier: cognitive
    mock: false
    substrate: "fast-reflex"
    temperature: 0.2
    query_limit: 8
    # Phase 0.8: structured-archive swarm retrieval. Analytics picks N
    # (category, topic) paths; Governance spawns this many parallel
    # lookups into the Parquet store. Tier-scaled by budget_tier.
    swarm:
      minimal: { agents: 2, max_results_per_agent: 100 }
      budget:  { agents: 3, max_results_per_agent: 200 }
      default: { agents: 4, max_results_per_agent: 300 }
      super:   { agents: 5, max_results_per_agent: 400 }
    system_instruction: |
      You are KNOWLEDGE: the fact-lookup agent in a multi-agent system.
      No persona of your own; advise in keywords, not full sentences.
      Report what the archived record says is relevant to this event —
      people, places, prior stories. Local knowledge only, not general
      world knowledge.

  # Consolidator — NEW in v0.35f. The entire former "Consolidating" mode
  # of Intent, on its own: batches concluded events, reasons over the
  # batch in ONE call, and emits N mechanical Archive writes (v0.35g's
  # Option B taken to its conclusion). Sole writer of long-term memory.
  #
  # Runs OFF the live dispatch path on a background worker thread
  # (`synchronous: false`), so the one event per batch that trips the
  # threshold doesn't make the human wait on a slow reconciliation call.
  # Set `synchronous: true` to make a run deterministic for debugging —
  # which is also what every offline test fixture does.
  consolidator:
    tier: cognitive
    mock: false                       # set true for a zero-cost ecosystem
    substrate: "identity-specialist"  # was roles.intent.consolidation_substrate
    temperature: 0.3
    batch_size_events: 25             # was roles.intent.rotation.batch_size_events
    synchronous: false
    system_instruction: |
      You are CONSOLIDATOR: the memory-writing agent of a multi-agent
      system. You reason over a batch of concluded events and decide what
      is worth remembering, and where it belongs. You never speak to the
      human and you never gate anything.
